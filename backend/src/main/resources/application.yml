spring:
  application:
    name: exsell
  
  datasource:
    url: jdbc:postgresql://localhost:5432/exsell
    username: postgres
    password: postgres123
    driver-class-name: org.postgresql.Driver
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          lob:
            non_contextual_creation: true
  
  jackson:
    serialization:
      write-dates-as-timestamps: false
      indent_output: true  # Moved this here

# MinIO Configuration
minio:
  endpoint: "http://localhost:9000"
  accessKey: "minioadmin"
  secretKey: "minioadmin"
  bucket: "marketplace-media"

# JWT Configuration
app:
  jwt:
    secret: "THIS_IS_A_FALLBACK_SECRET_AND_IT_MUST_BE_32_BYTES"
    expirationMs: 86400000  # 24 hours in milliseconds